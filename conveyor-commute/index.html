<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seat Rush — 通勤者传送</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#bfe0dc;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;border-radius:10px;
    box-shadow:0 18px 60px rgba(20,60,70,.28);}
</style>
<link rel="icon" href="data:,"></head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
/* =========================================================================
   Seat Rush — 单文件 Canvas 2D 原型
   -------------------------------------------------------------------------
   资源清单（依据美术图集 / 效果图提取，全部由 Canvas 2D 程序化绘制）：
     - 背景      : 薄荷格纹底板 + 径向柔光              #dff0ee / #e8f5f3
     - 传送带    : 圆角矩形闭环，三层描边                #5c929a / #7fb7bf / #93c8ce
     - 传送带箭头: 深青 V 形                               rgba(70,130,140,.55)
     - 座位      : 圆角沙发 + 顶部高光 + 深色描边         红 #e8483f / 蓝 #4a90e2
     - 通勤者    : 圆头 + 圆角身体 + 手脚 + 高光球        红 #ef5347 / 蓝 #4fa8f0
     - 空位      : 浅灰虚位框                             #c8d6d8
     - 底部槽条  : 灰色胶囊槽                             #aab8bd
     - 出口列车  : 深蓝车体 + 浅蓝内腔                     #3b539e / #5b7bd0
     - HUD 胶囊  : 渐变蓝 + 白色描边 + 金币               #5b7bd0 → #3b539e / #ffd34d
     - Reset 按钮: 蓝色圆形 + 白色回旋箭头
   【素材存疑】图集为扁平大图无 atlas/json，以下数值为按视觉估算：
     传送带带宽 70px、HUD 胶囊宽度、底部槽条槽位数量，均按效果图比例近似。
   ========================================================================= */

/* ---------------------------- 基础常量 ---------------------------- */
const W = 768, H = 1376;
const DEBUG = false;              // 开启后显示格子边界与图层名

const CAPACITY = 5;               // Seats 容量
const SPEED = 460;                // 传送带线速度 px/s
const SPAWN_T = 0.16;             // 通勤者上带位置（路径归一化 t）
const EXIT_T  = 0.52;             // 通勤者下带位置（路径归一化 t）

const CELL = 88, GAP = 10;
const GRID_X = 238, GRID_Y = 348;
const GRID_W = 3 * CELL + 2 * GAP;   // 284

const BELT_X = 100, BELT_Y = 180, BELT_W = 560, BELT_H = 620, BELT_R = 100;
const TRAIN = { x: 608, y: 1036, w: 152, h: 156 };

/* ---------------------------- 调色板 ---------------------------- */
const PAL = {
  seatR: { light:'#ff7264', base:'#e8483f', dark:'#b83028' },
  seatB: { light:'#74b4f8', base:'#4a90e2', dark:'#2d6cb5' },
  manR:  { light:'#ff8477', base:'#ef5347', dark:'#c3372c' },
  manB:  { light:'#86c7ff', base:'#4fa8f0', dark:'#2f7fc4' }
};

/* ---------------------------- Canvas 初始化 ---------------------------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * DPR;
cv.height = H * DPR;
ctx.scale(DPR, DPR);

function fitCanvas(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width  = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

/* ---------------------------- 通用绘制工具 ---------------------------- */
function rr(x, y, w, h, r){
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

/* ---------------------------- 圆角矩形路径采样器 ---------------------------- */
function makePath(x, y, w, h, r){
  const PI = Math.PI;
  const segs = [
    { type:'line', x1:x + r,     y1:y,         x2:x + w - r, y2:y },
    { type:'arc',  cx:x + w - r, cy:y + r,     r, a1:-PI/2,   a2:0 },
    { type:'line', x1:x + w,     y1:y + r,     x2:x + w,     y2:y + h - r },
    { type:'arc',  cx:x + w - r, cy:y + h - r, r, a1:0,       a2:PI/2 },
    { type:'line', x1:x + w - r, y1:y + h,     x2:x + r,     y2:y + h },
    { type:'arc',  cx:x + r,     cy:y + h - r, r, a1:PI/2,    a2:PI },
    { type:'line', x1:x,         y1:y + h - r, x2:x,         y2:y + r },
    { type:'arc',  cx:x + r,     cy:y + r,     r, a1:PI,      a2:PI * 1.5 }
  ];
  let total = 0;
  for (const s of segs){
    s.len = (s.type === 'line')
      ? Math.hypot(s.x2 - s.x1, s.y2 - s.y1)
      : Math.abs(s.a2 - s.a1) * s.r;
    s.start = total;
    total += s.len;
  }
  return {
    total,
    at(t){
      t = ((t % 1) + 1) % 1;
      let d = t * total;
      for (const s of segs){
        if (d <= s.len + 1e-9 && s.len > 0){
          const k = d / s.len;
          if (s.type === 'line'){
            return { x: s.x1 + (s.x2 - s.x1) * k, y: s.y1 + (s.y2 - s.y1) * k };
          }
          const a = s.a1 + (s.a2 - s.a1) * k;
          return { x: s.cx + Math.cos(a) * s.r, y: s.cy + Math.sin(a) * s.r };
        }
        d -= s.len;
      }
      return { x: segs[0].x1, y: segs[0].y1 };
    }
  };
}

const BELT = makePath(BELT_X, BELT_Y, BELT_W, BELT_H, BELT_R);

/* ---------------------------- 逻辑状态 ---------------------------- */
const state = {
  level: 1,
  phase: 'play',      // play | win | lose
  cells: [],
  belt: [],
  sent: 0,
  total: 0,
  t: 0,
  shake: 0,
  flash: 0,
  particles: [],
  floaters: []
};

/* ---------------------------- 关卡生成 ---------------------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* 生成 9 个格子的颜色队列；相邻格偏同色 → 形成同色组 */
function buildQueues(lv){
  const rnd = mulberry32(lv * 7919 + 13);
  const gens = lv >= 3 ? 3 : 2;
  const bias = lv === 1 ? 0.62 : lv === 2 ? 0.48 : 0.38;
  const cols = Array.from({ length: 9 }, () => []);

  for (let g = 0; g < gens; g++){
    const grid = [];
    for (let i = 0; i < 9; i++){
      const left = (i % 3) > 0 ? grid[i - 1] : null;
      const up   = i >= 3 ? grid[i - 3] : null;
      const r = rnd();
      let col;
      if (left && r < bias)            col = left;
      else if (up && r < bias + 0.15)  col = up;
      else                             col = rnd() < 0.5 ? 'R' : 'B';
      grid.push(col);
    }
    for (let i = 0; i < 9; i++) cols[i].push(grid[i]);
  }
  return cols;
}

function cellPos(i){
  const c = i % 3, r = (i / 3) | 0;
  return {
    x: GRID_X + c * (CELL + GAP) + CELL / 2,
    y: GRID_Y + r * (CELL + GAP) + CELL / 2
  };
}

function newGame(lv){
  state.level = lv;
  state.phase = 'play';
  state.sent = 0;
  state.belt = [];
  state.particles = [];
  state.floaters = [];
  state.shake = 0;
  state.flash = 0;
  state.t = 0;

  const queues = buildQueues(lv);
  state.cells = queues.map((q, i) => {
    const p = cellPos(i);
    return {
      x: p.x, y: p.y,
      queue: q.slice(1),
      color: q[0],
      pop: 0,
      wait: 0
    };
  });
  state.total = queues.reduce((s, q) => s + q.length, 0);
}

/* ---------------------------- 同色连通组 ---------------------------- */
function flood(idx, color){
  const seen = new Set();
  const out = [];
  const stack = [idx];
  while (stack.length){
    const i = stack.pop();
    if (seen.has(i)) continue;
    seen.add(i);
    const c = state.cells[i];
    if (!c || !c.color || c.color !== color) continue;
    out.push(i);
    const r = (i / 3) | 0, col = i % 3;
    if (col > 0) stack.push(i - 1);
    if (col < 2) stack.push(i + 1);
    if (r > 0)   stack.push(i - 3);
    if (r < 2)   stack.push(i + 3);
  }
  return out;
}

/* ---------------------------- 交互动作 ---------------------------- */
function trySelect(idx){
  const cell = state.cells[idx];
  if (!cell || !cell.color) return;

  const group = flood(idx, cell.color);
  if (!group.length) return;

  /* 容量判定：超过 Seats 上限 → 失败 */
  if (state.belt.length + group.length > CAPACITY){
    state.shake = 1;
    lose();
    return;
  }

  group.forEach((gi, k) => {
    const c = state.cells[gi];
    const col = c.color;
    c.color = null;
    c.wait = 0.28;
    state.belt.push({
      color: col,
      t: SPAWN_T,
      state: 'fly',
      flyT: 0,
      flyDur: 0.22,
      delay: k * 0.09,
      fromX: c.x,
      fromY: c.y,
      exitT: 0
    });
    spawnBurst(c.x, c.y, col);
  });
}

function spawnBurst(x, y, col){
  const th = PAL[col === 'R' ? 'manR' : 'manB'];
  for (let i = 0; i < 6; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 120;
    state.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 40,
      life: 1,
      max: 0.45 + Math.random() * 0.25,
      color: th.base,
      size: 3 + Math.random() * 4
    });
  }
}

function addFloater(x, y, text, color){
  state.floaters.push({ x, y, text, color, life: 1 });
}

function win(){
  if (state.phase !== 'play') return;
  state.phase = 'win';
}

function lose(){
  if (state.phase !== 'play') return;
  state.phase = 'lose';
  state.shake = 1;
  state.flash = 1;
}

/* ---------------------------- 更新 ---------------------------- */
function update(dt){
  state.t += dt;

  /* 补位 */
  for (const c of state.cells){
    if (!c.color && c.queue.length){
      c.wait -= dt;
      if (c.wait <= 0){
        c.color = c.queue.shift();
        c.pop = 1;
      }
    }
    if (c.pop > 0) c.pop = Math.max(0, c.pop - dt * 4.5);
  }

  /* 传送带上的通勤者 */
  let sentThisFrame = 0;
  for (const b of state.belt){
    if (b.delay > 0){ b.delay -= dt; continue; }

    if (b.state === 'fly'){
      b.flyT += dt;
      if (b.flyT >= b.flyDur) b.state = 'ride';
    } else if (b.state === 'ride'){
      b.t += (SPEED / BELT.total) * dt;
      if (b.t >= EXIT_T){
        b.state = 'exit';
        b.exitT = 0;
      }
    } else if (b.state === 'exit'){
      b.exitT += dt;
      if (b.exitT >= 0.5){
        b.gone = true;
        state.sent++;
        sentThisFrame++;
      }
    }
  }
  if (sentThisFrame > 0){
    addFloater(TRAIN.x + TRAIN.w / 2, TRAIN.y - 18, '+' + sentThisFrame, '#2f7fc4');
  }
  state.belt = state.belt.filter(b => !b.gone);

  /* 粒子 */
  for (const p of state.particles){
    p.life -= dt / p.max;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 420 * dt;
  }
  state.particles = state.particles.filter(p => p.life > 0);

  /* 浮动文字 */
  for (const f of state.floaters){
    f.life -= dt / 0.9;
    f.y -= 46 * dt;
  }
  state.floaters = state.floaters.filter(f => f.life > 0);

  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 3);
  if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 2.5);

  /* 胜利判定 */
  if (state.phase === 'play' && state.sent >= state.total && state.belt.length === 0){
    win();
  }
}

/* =========================================================================
   渲染层
   ========================================================================= */

/* ---------- 背景 ---------- */
function drawBackground(){
  ctx.fillStyle = '#dff0ee';
  ctx.fillRect(0, 0, W, H);

  const T = 74;
  for (let i = 0; i * T < W; i++){
    for (let j = 0; j * T < H; j++){
      if ((i + j) % 2 === 0){
        ctx.fillStyle = '#e9f6f4';
        ctx.fillRect(i * T, j * T, T, T);
      }
    }
  }

  const g = ctx.createRadialGradient(W / 2, H * 0.42, 180, W / 2, H * 0.5, 900);
  g.addColorStop(0, 'rgba(255,255,255,0.45)');
  g.addColorStop(1, 'rgba(150,200,200,0.22)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- 传送带通道 ---------- */
function drawBeltPath(){
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  /* 外投影 */
  ctx.save();
  ctx.shadowColor = 'rgba(40,90,100,0.28)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 8;
  rr(BELT_X, BELT_Y, BELT_W, BELT_H, BELT_R);
  ctx.lineWidth = 84;
  ctx.strokeStyle = '#5c929a';
  ctx.stroke();
  ctx.restore();

  /* 底层深青 */
  rr(BELT_X, BELT_Y, BELT_W, BELT_H, BELT_R);
  ctx.lineWidth = 80;
  ctx.strokeStyle = '#5c929a';
  ctx.stroke();

  /* 主体 */
  rr(BELT_X, BELT_Y, BELT_W, BELT_H, BELT_R);
  ctx.lineWidth = 68;
  ctx.strokeStyle = '#7fb7bf';
  ctx.stroke();

  /* 内层高光 */
  rr(BELT_X, BELT_Y, BELT_W, BELT_H, BELT_R);
  ctx.lineWidth = 46;
  ctx.strokeStyle = '#93c8ce';
  ctx.stroke();

  /* 方向箭头 */
  const N = 16;
  for (let i = 0; i < N; i++){
    const t = i / N + 0.012;
    const p  = BELT.at(t);
    const p2 = BELT.at(t + 0.006);
    const ang = Math.atan2(p2.y - p.y, p2.x - p.x);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(-8, -8);
    ctx.lineTo(5, 0);
    ctx.lineTo(-8, 8);
    ctx.strokeStyle = 'rgba(70,130,140,0.5)';
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- 座位 ---------- */
function drawSeat(cx, cy, color){
  const s = CELL;
  const x = cx - s / 2, y = cy - s / 2;
  const th = PAL[color === 'R' ? 'seatR' : 'seatB'];

  /* 投影 */
  ctx.fillStyle = 'rgba(40,80,90,0.18)';
  rr(x + 3, y + 8, s, s - 4, 15);
  ctx.fill();

  /* 底座渐变 */
  const g = ctx.createLinearGradient(x, y, x, y + s);
  g.addColorStop(0, th.light);
  g.addColorStop(0.55, th.base);
  g.addColorStop(1, th.dark);
  rr(x, y, s, s, 15);
  ctx.fillStyle = g;
  ctx.fill();

  /* 靠背高光 */
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  rr(x + 8, y + 8, s - 16, s * 0.42, 11);
  ctx.fill();

  /* 描边 */
  rr(x, y, s, s, 15);
  ctx.strokeStyle = th.dark;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  /* 底部亮条 */
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  rr(x + 13, y + s - 22, s - 26, 10, 5);
  ctx.fill();
}

/* ---------- 空位 ---------- */
function drawEmptySlot(cx, cy){
  const s = CELL;
  const x = cx - s / 2, y = cy - s / 2;
  rr(x, y, s, s, 15);
  ctx.fillStyle = 'rgba(190,210,214,0.35)';
  ctx.fill();
  ctx.save();
  ctx.setLineDash([7, 7]);
  ctx.strokeStyle = 'rgba(150,180,186,0.75)';
  ctx.lineWidth = 2.5;
  rr(x + 2, y + 2, s - 4, s - 4, 13);
  ctx.stroke();
  ctx.restore();
}

/* ---------- 通勤者 ---------- */
function drawCommuter(x, y, color, scale, alpha){
  const th = PAL[color === 'R' ? 'manR' : 'manB'];
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  /* 地面投影 */
  ctx.fillStyle = 'rgba(30,70,80,0.16)';
  ctx.beginPath();
  ctx.ellipse(0, 18, 13, 4.5, 0, 0, Math.PI * 2);
  ctx.fill();

  /* 腿 */
  ctx.fillStyle = th.dark;
  rr(-9, 6, 7, 11, 3.5); ctx.fill();
  rr( 2, 6, 7, 11, 3.5); ctx.fill();

  /* 手臂 */
  ctx.fillStyle = th.dark;
  rr(-16, -5, 7, 14, 3.5); ctx.fill();
  rr(  9, -5, 7, 14, 3.5); ctx.fill();

  /* 身体 */
  const g = ctx.createLinearGradient(0, -8, 0, 14);
  g.addColorStop(0, th.light);
  g.addColorStop(1, th.base);
  ctx.fillStyle = g;
  rr(-12, -8, 24, 20, 10);
  ctx.fill();

  /* 头部 */
  ctx.fillStyle = th.base;
  ctx.beginPath();
  ctx.arc(0, -15, 10.5, 0, Math.PI * 2);
  ctx.fill();

  /* 头部高光 */
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.beginPath();
  ctx.arc(-3.5, -18, 4.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* ---------- 棋盘层 ---------- */
function drawBoard(){
  for (let i = 0; i < 9; i++){
    const c = state.cells[i];
    if (!c) continue;

    if (c.color){
      drawSeat(c.x, c.y, c.color);
      const sc = 1 + c.pop * 0.32;
      drawCommuter(c.x, c.y + 2, c.color, sc, 1);
    } else {
      drawEmptySlot(c.x, c.y);
    }
  }

  if (DEBUG){
    ctx.strokeStyle = 'rgba(255,0,120,0.7)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 9; i++){
      const c = state.cells[i];
      ctx.strokeRect(c.x - CELL / 2, c.y - CELL / 2, CELL, CELL);
    }
  }
}

/* ---------- 底部槽条 + 出口列车 ---------- */
function drawBottomArea(){
  /* 槽条底板 */
  ctx.save();
  ctx.shadowColor = 'rgba(40,90,100,0.2)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 6;
  rr(44, 1050, 552, 128, 25);
  ctx.fillStyle = '#c2d4d7';
  ctx.fill();
  ctx.restore();

  rr(54, 1060, 532, 108, 19);
  ctx.fillStyle = '#dce9eb';
  ctx.fill();

  /* 槽位 */
  for (let i = 0; i < 14; i++){
    const sx = 64 + i * 38;
    rr(sx, 1068, 28, 92, 14);
    ctx.fillStyle = '#aab8bd';
    ctx.fill();
    rr(sx, 1068, 28, 92, 14);
    ctx.strokeStyle = 'rgba(120,145,150,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  /* 出口列车 */
  ctx.save();
  ctx.shadowColor = 'rgba(30,60,120,0.35)';
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 7;
  rr(TRAIN.x, TRAIN.y, TRAIN.w, TRAIN.h, 22);
  const tg = ctx.createLinearGradient(TRAIN.x, TRAIN.y, TRAIN.x, TRAIN.y + TRAIN.h);
  tg.addColorStop(0, '#5b7bd0');
  tg.addColorStop(1, '#33509e');
  ctx.fillStyle = tg;
  ctx.fill();
  ctx.restore();

  rr(TRAIN.x + 12, TRAIN.y + 12, TRAIN.w - 24, TRAIN.h - 24, 15);
  ctx.fillStyle = '#6f8ad8';
  ctx.fill();

  rr(TRAIN.x + 12, TRAIN.y + 12, TRAIN.w - 24, TRAIN.h - 24, 15);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 2;
  ctx.stroke();

  /* 车内常驻乘客（装饰） */
  drawCommuter(TRAIN.x + TRAIN.w / 2, TRAIN.y + TRAIN.h / 2 + 6, 'R', 0.95, 0.9);

  /* 进度文字 */
  ctx.font = '700 26px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#3a6b74';
  ctx.fillText('已送出  ' + state.sent + ' / ' + state.total, 58, 1222);
}

/* ---------- 传送带上的通勤者 ---------- */
function riderPos(b){
  if (b.state === 'fly'){
    const p = BELT.at(b.t);
    const k = clamp(b.flyT / b.flyDur, 0, 1);
    const e = easeOutCubic(k);
    return {
      x: b.fromX + (p.x - b.fromX) * e,
      y: b.fromY + (p.y - b.fromY) * e,
      s: 0.72 + 0.28 * e,
      a: 1
    };
  }

  const p = BELT.at(b.t);

  if (b.state === 'ride'){
    return { x: p.x, y: p.y, s: 1, a: 1 };
  }

  /* exit：向出口列车滑行并淡出 */
  const k = clamp(b.exitT / 0.5, 0, 1);
  const tx = TRAIN.x + TRAIN.w / 2;
  const ty = TRAIN.y + TRAIN.h / 2;
  const e = k * k;
  const fade = clamp((k - 0.55) / 0.45, 0, 1);
  return {
    x: p.x + (tx - p.x) * e,
    y: p.y + (ty - p.y) * e - Math.sin(k * Math.PI) * 70,
    s: 1 - fade * 0.6,
    a: 1 - fade
  };
}

function drawBeltRiders(){
  for (const b of state.belt){
    if (b.delay > 0) continue;
    const p = riderPos(b);
    /* 骑行中的通勤者下方画一条轻微弧线阴影 */
    drawCommuter(p.x, p.y, b.color, p.s, p.a);
  }
}

/* ---------- HUD ---------- */
function drawCoin(cx, cy, r){
  const g = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
  g.addColorStop(0, '#ffe27a');
  g.addColorStop(1, '#f0a92a');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#c9801a';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx - r * 0.3, cy - r * 0.32, r * 0.36, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fill();
}

function drawHUD(){
  const w = 404, h = 72;
  const x = (W - w) / 2, y = 26;

  ctx.save();
  ctx.shadowColor = 'rgba(40,70,130,0.35)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 7;
  rr(x, y, w, h, h / 2);
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, '#5b7bd0');
  g.addColorStop(1, '#3b539e');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.restore();

  rr(x, y, w, h, h / 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.42)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.font = '700 30px system-ui, -apple-system, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('Level ' + state.level, x + 32, y + h / 2 + 2);

  const coinX = x + 196;
  drawCoin(coinX, y + h / 2, 17);

  const over = state.belt.length >= CAPACITY;
  ctx.font = '700 27px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = over ? '#ffb3ac' : '#ffffff';
  ctx.fillText('Seats: ' + state.belt.length + '/' + CAPACITY, coinX + 28, y + h / 2 + 2);
}

/* ---------- Reset 按钮 ---------- */
const RESET_BTN = { x: 700, y: 1300, r: 48 };

function drawResetBtn(){
  const { x, y, r } = RESET_BTN;

  ctx.save();
  ctx.shadowColor = 'rgba(20,50,110,0.35)';
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 7;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  const g = ctx.createLinearGradient(x, y - r, x, y + r);
  g.addColorStop(0, '#5b7bd0');
  g.addColorStop(1, '#33509e');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.restore();

  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  /* 回旋箭头 */
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, 1, 17, -Math.PI * 0.82, Math.PI * 0.55);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(1, -21);
  ctx.lineTo(13, -13);
  ctx.lineTo(-2, -7);
  ctx.closePath();
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.restore();
}

/* ---------- 粒子 / 浮字 ---------- */
function drawFX(){
  for (const p of state.particles){
    ctx.globalAlpha = clamp(p.life, 0, 1) * 0.9;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * clamp(p.life, 0.2, 1), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const f of state.floaters){
    ctx.globalAlpha = clamp(f.life, 0, 1);
    ctx.font = '800 30px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/* ---------- 弹窗层 ---------- */
const POPUP = { x: 154, y: 470, w: 460, h: 380 };
const BTN_MAIN = { x: 214, y: 620, w: 340, h: 84 };
const BTN_SUB  = { x: 214, y: 720, w: 340, h: 84 };

function drawButton(b, label, primary){
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  if (primary){
    g.addColorStop(0, '#5fd07a');
    g.addColorStop(1, '#2ea54e');
  } else {
    g.addColorStop(0, '#8ea6c8');
    g.addColorStop(1, '#63799b');
  }
  ctx.save();
  ctx.shadowColor = 'rgba(20,50,80,0.28)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 5;
  rr(b.x, b.y, b.w, b.h, b.h / 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.restore();

  rr(b.x, b.y, b.w, b.h, b.h / 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.font = '800 32px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 2);
}

function drawOverlay(){
  if (state.phase === 'play') return;

  ctx.fillStyle = 'rgba(20,42,64,0.55)';
  ctx.fillRect(0, 0, W, H);

  const isWin = state.phase === 'win';

  ctx.save();
  ctx.shadowColor = 'rgba(10,30,60,0.45)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 12;
  rr(POPUP.x, POPUP.y, POPUP.w, POPUP.h, 34);
  const g = ctx.createLinearGradient(POPUP.x, POPUP.y, POPUP.x, POPUP.y + POPUP.h);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(1, '#e6f2f6');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.restore();

  rr(POPUP.x, POPUP.y, POPUP.w, POPUP.h, 34);
  ctx.strokeStyle = 'rgba(120,170,190,0.55)';
  ctx.lineWidth = 3;
  ctx.stroke();

  /* 标题 */
  ctx.font = '900 48px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = isWin ? '#2ea54e' : '#d9433a';
  ctx.fillText(isWin ? '通关！' : '超载！', W / 2, POPUP.y + 76);

  /* 副标题 */
  ctx.font = '700 26px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#4b6b78';
  if (isWin){
    ctx.fillText('全部通勤者已送出闸口', W / 2, POPUP.y + 138);
  } else {
    ctx.fillText('传送带超过 ' + CAPACITY + ' 个座位', W / 2, POPUP.y + 138);
  }

  ctx.font = '600 23px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#7b98a5';
  ctx.fillText('已送出 ' + state.sent + ' / ' + state.total, W / 2, POPUP.y + 186);

  if (isWin){
    drawButton(BTN_MAIN, '下一关', true);
    drawButton(BTN_SUB, '重玩本关', false);
  } else {
    drawButton(BTN_MAIN, '重试', true);
  }
}

/* ---------- 主渲染 ---------- */
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  /* 屏幕震动 */
  if (state.shake > 0){
    const s = state.shake * 12;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }

  drawBackground();
  drawBeltPath();
  drawBoard();
  drawBottomArea();
  drawBeltRiders();
  drawHUD();
  drawResetBtn();
  drawFX();

  /* 溢出红闪 */
  if (state.flash > 0){
    const g = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 900);
    g.addColorStop(0, 'rgba(220,60,50,0)');
    g.addColorStop(1, 'rgba(220,60,50,' + (state.flash * 0.55) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  drawOverlay();

  if (DEBUG){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.font = '16px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('LAYER: bg / belt / board / bottom / riders / hud / fx / overlay', 14, 14);
    ctx.fillText('belt=' + state.belt.length + ' sent=' + state.sent + '/' + state.total, 14, 36);
    ctx.strokeStyle = 'rgba(0,150,255,0.4)';
    ctx.strokeRect(BELT_X - 40, BELT_Y - 40, BELT_W + 80, BELT_H + 80);
  }
}

/* =========================================================================
   输入
   ========================================================================= */
function toLocal(e){
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width * W,
    y: (e.clientY - r.top) / r.height * H
  };
}

function inRect(x, y, b){
  return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
}

function inCircle(x, y, c){
  return Math.hypot(x - c.x, y - c.y) <= c.r;
}

function onTap(x, y){
  /* 弹窗阶段 */
  if (state.phase === 'win'){
    if (inRect(x, y, BTN_MAIN)){
      newGame(state.level >= 3 ? 1 : state.level + 1);
      return;
    }
    if (inRect(x, y, BTN_SUB)){
      newGame(state.level);
      return;
    }
    return;
  }
  if (state.phase === 'lose'){
    if (inRect(x, y, BTN_MAIN)){
      newGame(state.level);
      return;
    }
    return;
  }

  /* Reset */
  if (inCircle(x, y, RESET_BTN)){
    newGame(state.level);
    return;
  }

  /* 座位点击 */
  for (let i = 0; i < 9; i++){
    const c = state.cells[i];
    if (!c || !c.color) continue;
    if (Math.abs(x - c.x) <= CELL / 2 && Math.abs(y - c.y) <= CELL / 2){
      trySelect(i);
      return;
    }
  }
}

cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  const p = toLocal(e);
  onTap(p.x, p.y);
}, { passive: false });

cv.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================================
   主循环
   ========================================================================= */
let lastTime = performance.now();

function loop(now){
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state.phase === 'play'){
    update(dt);
  } else {
    /* 结算时仍让特效收尾 */
    for (const p of state.particles){
      p.life -= dt / p.max;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 420 * dt;
    }
    state.particles = state.particles.filter(p => p.life > 0);
    for (const f of state.floaters){
      f.life -= dt / 0.9;
      f.y -= 46 * dt;
    }
    state.floaters = state.floaters.filter(f => f.life > 0);
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 3);
    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 2.5);
  }

  render();
  requestAnimationFrame(loop);
}

/* ---------------------------- 启动 ---------------------------- */
newGame(1);
requestAnimationFrame(loop);
</script>
